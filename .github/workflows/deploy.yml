name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable deploys."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.ok == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.ok == 'true'
        run: npm run typecheck

      - name: Find or create D1 database
        if: steps.check.outputs.ok == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="atlas-provisions") | .uuid'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create atlas-provisions
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.jsonc

      - name: Apply migrations
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply atlas-provisions --remote

      - name: Build and deploy
        if: steps.check.outputs.ok == 'true'
        run: npm run deploy
