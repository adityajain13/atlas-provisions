name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable deploys."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.ok == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.ok == 'true'
        run: npm run typecheck

      - name: Find or create D1 database
        if: steps.check.outputs.ok == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="atlas-provisions") | .uuid'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create atlas-provisions
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.jsonc

      - name: Record restore point
        if: steps.check.outputs.ok == 'true'
        # D1 Time Travel keeps point-in-time history. If a migration goes wrong, restore with:
        #   npx wrangler d1 time-travel restore atlas-provisions --bookmark=<bookmark below>
        run: npx wrangler d1 time-travel info atlas-provisions || echo "::warning::Could not read a Time Travel bookmark"

      - name: Apply migrations
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply atlas-provisions --remote

      - name: Build and deploy
        if: steps.check.outputs.ok == 'true'
        run: npm run deploy

      - name: Row counts
        if: steps.check.outputs.ok == 'true'
        # Counts only, never row contents: this log is public.
        run: |
          npx wrangler d1 execute atlas-provisions --remote --json --command "SELECT
            (SELECT COUNT(*) FROM households) AS households,
            (SELECT COUNT(*) FROM household_members) AS members,
            (SELECT COUNT(*) FROM household_members WHERE role = 'owner') AS owners,
            (SELECT COUNT(*) FROM pantry_items) AS pantry,
            (SELECT COUNT(*) FROM meal_plans) AS plans,
            (SELECT COUNT(*) FROM checks) AS checks,
            (SELECT COUNT(*) FROM meal_ratings) AS ratings" | jq -c '.[0].results[0]'
