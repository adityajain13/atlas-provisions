<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E0C" />
    <title>Atlas Provisions</title>
    <!-- Applies the device's Black appearance before the first paint (key: atlas-theme, see lib/theme.ts). -->
    <script>
      try {
        if (localStorage.getItem('atlas-theme') === 'black') document.documentElement.setAttribute('data-theme', 'black');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/provisions/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/provisions/favicon-32.png" />
    <link rel="apple-touch-icon" href="/provisions/apple-touch-icon.png" />
    <link rel="manifest" href="/provisions/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
